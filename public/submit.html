<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>发布投稿 · 三中投稿墙</title><link rel="icon" href="/assets/school-logo.jpg"><link rel="stylesheet" href="/assets/style.css"></head><body><div class="bg-orb orb1"></div><div class="bg-orb orb2"></div><div class="bg-orb orb3"></div><div class="stars" id="stars"></div><div class="scanline"></div><header class="nav"><div class="nav-inner"><a class="brand" href="/"><div class="brand-logo"><img src="/assets/school-logo.jpg"></div><div><strong>三中投稿墙</strong><span>HENGSHUI NO.3 MIDDLE SCHOOL</span></div></a><div class="nav-links"><a class="nav-link" href="/">投稿墙</a><a class="nav-link active" href="/submit.html">发布投稿</a><a class="nav-link" href="/chat.html">在线聊天室</a></div></div></header><main><section class="page-shell"><div class="eyebrow"><i></i> CREATE POST</div><h1 class="page-title">发布一条投稿</h1><p class="page-desc">选择匿名或公开昵称，写下想分享的内容。发布成功后，投稿墙会自动出现新内容，无需刷新页面。</p><div class="form-card"><div class="mode-tabs"><button id="anonBtn" class="active">匿名投稿</button><button id="openBtn">不匿名投稿</button></div><div id="nicknameBox" class="field" hidden><label>昵称</label><input id="nickname" maxlength="50" placeholder="例如：三中小透明"></div><div class="field"><label>分类</label><select id="category"><option>校园日常</option><option>学习交流</option><option>失物招领</option><option>表白墙</option><option>吐槽建议</option><option>公告</option></select></div><div class="field"><label>内容</label><textarea id="content" maxlength="2000" placeholder="写下你想分享的内容……"></textarea><div class="counter"><span id="counter">0</span>/2000</div></div><div class="field file-box"><label>图片（可选）</label><input id="image" type="file" accept=".jpg,.jpeg,.png,.gif,.webp,image/jpeg,image/png,image/gif,image/webp"><div class="file-hint">仅支持固定图片格式 JPG / JPEG / PNG / GIF / WEBP，最大 50MB；5 分钟内只能成功上传 1 张。</div></div><div class="notice">请遵守校园社区规则，不发布骚扰、威胁、隐私泄露或违法内容。</div><button class="publish" id="publish">发布投稿 <span>→</span></button></div></section></main><footer><span>三中投稿墙</span><span>发布页面</span></footer><div class="toast" id="toast"></div><script src="/assets/submit.js"></script></body></html>
